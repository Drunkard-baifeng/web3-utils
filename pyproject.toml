[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "web3-utils"
version = "1.0.7"
description = "🔐 多链钱包工具集 - 支持 EVM、Bitcoin、Tron、Cosmos 生态"
authors = [
    {name = "baifeng", email = "1765311475@qq.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
keywords = [
    "web3", "wallet", "cryptocurrency", "blockchain", 
    "bitcoin", "ethereum", "tron", "cosmos", 
    "bip44", "mnemonic", "private-key", "address-generation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "eth-account",
    "loguru", 
    "web3",
    "bitcoinlib",
    "ecdsa",
    "mnemonic",
    "tronpy",
    "requests",
    "bech32",
    "cosmpy>=0.11.1",
    "mospy-wallet>=0.6.0"
]

[project.urls]
Homepage = "https://github.com/Drunkard-baifeng/web3-wallet-utils"
Repository = "https://github.com/Drunkard-baifeng/web3-wallet-utils"
Issues = "https://github.com/Drunkard-baifeng/web3-wallet-utils/issues"
Documentation = "https://github.com/Drunkard-baifeng/web3-wallet-utils#readme"

[tool.setuptools.packages.find]
where = ["src"]
include = ["web3_utils*"]
exclude = ["tests*", "web3env*", "*.egg-info*"]

[tool.setuptools.package-data]
"*" = ["*.py"]